<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantage</title>
<style>
:root { --green:#2e7d32; --red:#c62828; --amber:#f9a825; --blue:#0d47a1; --teal:#0b7285; }
* { box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       margin:0; background:#f5f6f8; color:#1a1a1a; }
header { background:#0d1b2a; color:#fff; padding:10px 20px; display:flex; align-items:center; gap:24px; }
header .logo { font-weight:800; font-size:18px; letter-spacing:1px; }
header a { color:#cfd8e3; text-decoration:none; font-size:14px; padding:4px 2px; }
header a.active, header a:hover { color:#fff; border-bottom:2px solid #4fc3f7; }
main { max-width:1080px; margin:18px auto; padding:0 16px; }
.card { background:#fff; border-radius:10px; padding:16px 20px; margin-bottom:16px;
        box-shadow:0 1px 3px rgba(0,0,0,.08); }
h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 10px; }
.badge { display:inline-block; color:#fff; font-weight:700; padding:3px 10px; border-radius:4px; font-size:14px; }
.badge.notrade { background:var(--amber); } .badge.call { background:var(--green); }
.badge.put { background:var(--red); } .badge.aside { background:#757575; }
.grey { color:#777; font-size:12px; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th { text-align:left; color:#666; font-weight:600; padding:4px 8px; border-bottom:1px solid #e0e0e0; }
td { padding:4px 8px; border-bottom:1px solid #f0f0f0; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
.zone-card { border-radius:10px; color:#fff; padding:10px 14px; margin:6px 0; font-size:13px; }
.zone-card.call { background:var(--green); } .zone-card.put { background:var(--red); }
.zone-card .t { font-weight:700; font-size:14px; }
.ladder td { border:none; padding:0 6px; height:15px; }
.ladder .bar { height:11px; background:#9ecad6; border-radius:2px; }
.ladder .bar.inval { background:var(--teal); } .ladder .bar.poc { background:#063f4a; }
.ladder .px { width:64px; text-align:right; font-size:11px; color:#555; white-space:nowrap; }
.ladder .px.b { font-weight:700; color:#000; }
.ladder .lbl { font-size:11px; color:#444; white-space:nowrap; }
.ladder tr.price-row .px { background:var(--blue); color:#fff; border-radius:8px; font-weight:700; }
.eventbox { background:#fff3e0; border-left:4px solid #ef6c00; padding:8px 12px; font-size:13px; margin:8px 0; }
.up { color:var(--green); font-weight:700; } .down { color:var(--red); font-weight:700; }
form.inline input, form.inline select { margin:2px 6px 2px 0; padding:5px 8px; border:1px solid #ccc; border-radius:5px; font-size:13px; }
button { background:var(--blue); color:#fff; border:none; border-radius:5px; padding:6px 12px; cursor:pointer; font-size:13px; }
button.danger { background:#b71c1c; padding:2px 8px; font-size:11px; }
.pill { display:inline-block; background:#e3f2fd; color:#0d47a1; border-radius:10px; padding:1px 8px; font-size:11px; margin-left:6px; }
.cols { display:flex; gap:16px; flex-wrap:wrap; } .cols > div { flex:1; min-width:340px; }
abbr { text-decoration:underline dotted #aaa; cursor:help; text-underline-offset:2px; }
.zone-card .sub { opacity:.75; font-size:11px; }
.refresh { float:right; font-size:13px; background:#0d47a1; color:#fff; text-decoration:none;
           padding:5px 12px; border-radius:6px; font-weight:600; }
.tfbar { font-size:12px; font-weight:400; margin-left:8px; }
.tfbar a { text-decoration:none; color:#555; background:#eceff1; border-radius:5px;
           padding:3px 9px; margin-right:4px; }
.tfbar a.on { background:#0d47a1; color:#fff; }
</style>
</head>
<body>
<header>
  <span class="logo">VANTAGE</span>
  <a href="/" class="{{ 'active' if page=='today' }}">Real Time</a>
  <a href="/levels" class="{{ 'active' if page=='levels' }}">Levels</a>
  <a href="/history" class="{{ 'active' if page=='history' }}">History</a>
  <a href="/settings" class="{{ 'active' if page=='settings' }}">Settings</a>
</header>
<main>
{% block content %}{% endblock %}
<p class="grey">Decision map built from published author levels and public price data; informational, not personalized investment advice.</p>
</main>
</body>
</html>
