name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for keyless auth to GCP

env:
  PROJECT_ID: patexia-vantage
  REGION: us-central1
  SERVICE: vantage
  JOB: vantage-daily-run

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Profile regression + invariants
        run: python -m tests.test_regression
      - name: Email guard (no images/SVG/scripts, ES-only)
        run: python -m tests.test_email_guard
      - name: Quote provenance (Schwab/Yahoo fallback)
        run: python -m tests.test_quote_source
      - name: Multi-instrument guards
        run: python -m tests.test_instruments
      - name: Schwab import (ordering, splits, reconciliation)
        run: python -m tests.test_schwab_import
      - name: Auth guards (hashing, IAP-header trust, CSRF)
        run: python -m tests.test_auth
      - name: Admin console (access, doc confinement, health fail-soft)
        run: python -m tests.test_admin

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/424459368059/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: vantage-deployer@patexia-vantage.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Bake the change log from git
        run: python scripts/gen_build_info.py app/build_info.json

      - name: Deploy service
        run: |
          gcloud run deploy "$SERVICE" --source . \
            --project="$PROJECT_ID" --region="$REGION" \
            --no-allow-unauthenticated \
            --min-instances=1 \
            --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VANTAGE_ALLOWED_EMAILS=pedram@patexia.com,VANTAGE_BASE_URL=https://vantage-424459368059.us-central1.run.app,SES_AWS_REGION=us-east-1,"SES_FROM_EMAIL=Vantage <vantage@notify.patexia.com>",SES_REPLY_TO=pedram@patexia.com \
            --set-secrets="AWS_ACCESS_KEY_ID=projects/349112552843/secrets/connect-redesign-aws-access-key-id:latest,AWS_SECRET_ACCESS_KEY=projects/349112552843/secrets/connect-redesign-aws-secret-access-key:latest" \
            --memory=512Mi --cpu=1 --timeout=120 --max-instances=2 --quiet

      - name: Point the daily job at the new image
        run: |
          IMG=$(gcloud run services describe "$SERVICE" --region="$REGION" \
                --project="$PROJECT_ID" --format='value(spec.template.spec.containers[0].image)')
          gcloud run jobs update "$JOB" --image="$IMG" \
            --region="$REGION" --project="$PROJECT_ID" --quiet
